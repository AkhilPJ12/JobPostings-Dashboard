name: Scrape Jobs

on:
  schedule:
    - cron: '0 13 * * *'    # 7 AM CST (13:00 UTC)
    - cron: '0 20 * * *'    # 2 PM CST (20:00 UTC)
  workflow_dispatch:          # allow manual trigger from GitHub UI

jobs:
  # Fast job: API-only scrapers — no Playwright needed (~2 min)
  scrape-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: pnpm install

      - name: Run API scrapers (parallel)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/scrape-all-jobs.ts --api-only

  # Slow job: Browser scrapers — needs Playwright (~40 min)
  scrape-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - run: pnpm install
      - run: pnpm exec playwright install chromium --with-deps

      - name: Run browser scrapers (sequential)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npx tsx scripts/scrape-all-jobs.ts --browser-only
