name: Scrape Jobs

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 20 * * *'
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile
      - name: Apply lifecycle rules once
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm exec tsx scripts/scrape-all-jobs.ts --maintenance-only

  scrape:
    needs: maintenance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        kind: [api, browser]
        batch: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-scraping.txt
      - uses: pnpm/action-setup@v5
        with:
          version: 9.15.9
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r scripts/requirements-scraping.txt
      - if: matrix.kind == 'browser'
        run: pnpm exec playwright install chromium --with-deps
      - if: matrix.kind == 'browser'
        run: scrapling install
      - name: Run source batch
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPING_FALLBACK: scrapling
          SCRAPLING_PYTHON: python
          SCRAPLING_BROWSER_READY: ${{ matrix.kind == 'browser' && 'true' || 'false' }}
        run: pnpm exec tsx scripts/scrape-all-jobs.ts --${{ matrix.kind }}-only --batch ${{ matrix.batch }}
